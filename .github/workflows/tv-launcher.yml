name: Bruce TV (APK)
on:
  push:
    branches: [main]
    paths: ['tv-launcher/**', '.github/workflows/tv-launcher.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: bruce-tv, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      # même clé de signature d'une version à l'autre (pour pouvoir mettre à jour sans désinstaller)
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bruce-tv-signing-v1
      - name: Compiler l'APK
        id: build
        run: |
          set -o pipefail
          cd tv-launcher
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log
          cp app/build/outputs/apk/release/app-release.apk ../BruceTV.apk
      - name: Publier l'APK
        if: success()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete bruce-tv -y --cleanup-tag || true
          gh release create bruce-tv BruceTV.apk --title "Bruce TV (launcher)" --notes "Écran d'accueil Liquid Glass pour la clé Google TV — build ${{ github.run_number }}" --latest
      - name: Renvoyer le journal en cas d'erreur
        if: failure()
        run: |
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git fetch origin build-logs || true
          git checkout -B build-logs
          git rm -rq --cached . >/dev/null 2>&1 || true
          tail -c 60000 build.log > tv-build.log || echo "pas de journal" > tv-build.log
          git add -f tv-build.log
          git commit -m "journal de compilation ${{ github.run_number }}" || true
          git push -f origin build-logs
